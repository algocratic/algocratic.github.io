<!-- @dsCard group="Colors" viewport="700x150" name="Corporate palette" subtitle="Paper-world core: ink, navy, gold glint, GRAY, silver, cream, charcoal" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--af-paper)}
.g{display:grid;grid-template-columns:repeat(8,1fr);height:150px}
.s{display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px}
.s b{font-size:11px;font-weight:600}.s code{font-family:var(--font-mono);font-size:9.5px;opacity:.75}</style></head><body>
<div class="g">
<div class="s" style="background:var(--af-ink);color:var(--af-cream)"><b>ink</b><code>#0D1B2A</code></div>
<div class="s" style="background:var(--af-navy);color:#fff"><b>navy</b><code>#16305F</code></div>
<div class="s" style="background:var(--af-navy-deep);color:#fff"><b>navy-deep</b><code>#0F2347</code></div>
<div class="s" style="background:var(--af-gold);color:var(--af-ink)"><b>gold</b><code>#F0B82D</code></div>
<div class="s" style="background:var(--af-slate);color:#fff"><b>slate / GRAY</b><code>#53565A</code></div>
<div class="s" style="background:var(--af-silver);color:var(--af-ink)"><b>silver</b><code>#E2E1DD</code></div>
<div class="s" style="background:var(--af-cream);color:var(--af-ink)"><b>cream</b><code>#F2ECD9</code></div>
<div class="s" style="background:var(--af-charcoal);color:var(--af-cream)"><b>charcoal</b><code>#363E4A</code></div>
</div></body></html>

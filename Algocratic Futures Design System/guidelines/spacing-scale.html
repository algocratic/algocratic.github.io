<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base scale, space-1 through space-10" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 24px;background:var(--af-paper);font-family:var(--font-mono);color:var(--af-ink)}
.r{display:flex;align-items:center;gap:12px;margin-bottom:7px;font-size:10px}
.r i{height:12px;background:var(--af-navy);display:block;border-radius:2px}
.r span{color:var(--af-slate);width:110px}</style></head><body>
<div class="r"><span>--space-2 · 8px</span><i style="width:8px"></i></div>
<div class="r"><span>--space-4 · 16px</span><i style="width:16px"></i></div>
<div class="r"><span>--space-6 · 24px</span><i style="width:24px"></i></div>
<div class="r"><span>--space-8 · 40px</span><i style="width:40px"></i></div>
<div class="r"><span>--space-10 · 72px</span><i style="width:72px;background:var(--af-gold)"></i></div>
</body></html>

<!-- @dsCard group="Colors" viewport="700x150" name="Retro stripe set" subtitle="Course-banner diagonals: five stripes, cream gaps, on charcoal" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans)}
.demo{height:96px;background:var(--af-charcoal);position:relative;overflow:hidden}
.stripes{position:absolute;top:-30px;bottom:-30px;right:8%;width:46%;display:flex;gap:7px;transform:skewX(-20deg)}
.stripes i{flex:1;border-left:7px solid var(--stripe-gap);border-right:0}
.chips{display:flex;height:54px}
.c{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:9.5px;color:#fff}</style></head><body>
<div class="demo"><div class="stripes"><i style="background:var(--stripe-1)"></i><i style="background:var(--stripe-2)"></i><i style="background:var(--stripe-3)"></i><i style="background:var(--stripe-4)"></i><i style="background:var(--stripe-5)"></i></div></div>
<div class="chips">
<div class="c" style="background:var(--stripe-1)">#A93226</div>
<div class="c" style="background:var(--stripe-2)">#DD5A2B</div>
<div class="c" style="background:var(--stripe-3);color:#3A2D00">#EFA43C</div>
<div class="c" style="background:var(--stripe-4)">#4F8F53</div>
<div class="c" style="background:var(--stripe-5)">#2BA3C4</div>
<div class="c" style="background:var(--stripe-gap);color:var(--af-charcoal)">gap #F2ECD3</div>
</div></body></html>

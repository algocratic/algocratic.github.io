<!-- @dsCard group="Colors" viewport="700x170" name="PRISM clearance spectrum" subtitle="Nine bands, infrared→ultraviolet. Semantic: clearance & competency, never decoration" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--af-paper)}
.rail{height:8px;background:var(--prism-rail)}
.g{display:grid;grid-template-columns:repeat(9,1fr);height:118px}
.s{display:flex;flex-direction:column;justify-content:flex-end;padding:7px 8px;color:#fff}
.s b{font-size:9.5px;font-weight:600;letter-spacing:.06em}.s code{font-family:var(--font-mono);font-size:9px;opacity:.8}
.gray{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--prism-gray);color:#fff;font-size:11px}
.gray code{font-family:var(--font-mono);font-size:10px;opacity:.8}</style></head><body>
<div class="rail"></div>
<div class="g">
<div class="s" style="background:var(--prism-infrared)"><b>INFRARED</b><code>#A01028</code></div>
<div class="s" style="background:var(--prism-red)"><b>RED</b><code>#E03131</code></div>
<div class="s" style="background:var(--prism-orange)"><b>ORANGE</b><code>#E8590C</code></div>
<div class="s" style="background:var(--prism-yellow);color:#3A2D00"><b>YELLOW</b><code>#F2C037</code></div>
<div class="s" style="background:var(--prism-green)"><b>GREEN</b><code>#2F9E44</code></div>
<div class="s" style="background:var(--prism-blue)"><b>BLUE</b><code>#1971C2</code></div>
<div class="s" style="background:var(--prism-indigo)"><b>INDIGO</b><code>#3F3CA6</code></div>
<div class="s" style="background:var(--prism-violet)"><b>VIOLET</b><code>#6D28D9</code></div>
<div class="s" style="background:var(--prism-ultraviolet)"><b>ULTRAVIOLET</b><code>#3B0F73</code></div>
</div>
<div class="gray"><b>GRAY</b><code>#53565A</code><span style="opacity:.85">Gather Required Aesthetic Yields — the collaboration band sits outside the spectrum</span></div>
</body></html>
